services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: getpersona
      POSTGRES_PASSWORD: getpersona
      POSTGRES_DB: getpersona
    ports:
      - '5432:5432'
    volumes:
      - gp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getpersona -d getpersona']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gp_pg:
